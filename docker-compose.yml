services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fishhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fishhub}
      POSTGRES_DB: ${POSTGRES_DB:-fishhub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  influxdb:
    image: influxdb:3-core
    user: "0:0"
    ports:
      - "8181:8181"
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --admin-token-file=/run/secrets/influxdb-admin-token
    volumes:
      - influxdb_data:/var/lib/influxdb3/data
    secrets:
      - influxdb-admin-token

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      INFLUXDB3_TOKEN: ${INFLUXDB3_TOKEN}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  asynqmon:
    image: hibiken/asynqmon:latest
    platform: linux/amd64
    ports:
      - "8090:8080"
    command: --redis-addr=redis:6379
    depends_on:
      - redis

  emqx:
    image: emqx:5
    ports:
      - "1883:1883"    # MQTT plain TCP
      - "18083:18083"  # Dashboard + REST API
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - emqx_data:/opt/emqx/data

secrets:
  influxdb-admin-token:
    file: ${INFLUX_TOKEN_FILE}

volumes:
  postgres_data:
  influxdb_data:
  grafana_data:
  redis_data:
  emqx_data:
